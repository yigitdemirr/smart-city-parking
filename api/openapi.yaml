openapi: 3.0.3
info:
  title: Smart City Parking API (Project B)
  version: 0.1.0-m1
  description: |
    API contract designed in Milestone M1.
    * All bodies are JSON (UTF-8). Times are ISO-8601 with offset (UTC on output).
    * Authentication: `Authorization: Bearer <JWT>` (except /auth/* and /health).
    * Every data-changing request (hold, pay, cancel, admin create/update) MUST carry
      `Idempotency-Key: <operationId>` - a UUID v4 generated by the client once per
      user intent and re-sent unchanged on every retry. The server stores the outcome
      in the same DB transaction and replays it for repeated requests.
    * Payments are SIMULATED. No real money and no card data are processed.
    * Error body: `{ "error": { "code": "SPACE_UNAVAILABLE", "message": "...", "details": {} } }`
servers:
  - url: http://localhost:8000/api/v1
security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service and database reachable
          content:
            application/json:
              example: { "status": "ok", "db": "ok", "serverTime": "2026-12-01T09:00:00Z" }

  /auth/register:
    post:
      summary: Register a driver account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example: { "email": "ola@example.com", "password": "S3cure!pass", "displayName": "Ola" }
      responses:
        '201':
          description: Created
          content:
            application/json:
              example: { "userId": "7c1e...", "email": "ola@example.com", "role": "DRIVER" }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      summary: Log in and obtain a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example: { "email": "ola@example.com", "password": "S3cure!pass" }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              example:
                accessToken: "eyJhbGciOi..."
                tokenType: Bearer
                expiresIn: 3600
                user: { "userId": "7c1e...", "displayName": "Ola", "role": "DRIVER" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /facilities/nearby:
    get:
      summary: Location-dependent query - nearest facilities with free spaces
      description: |
        "Nearest" = straight-line great-circle (haversine) distance in metres from the
        position supplied by the client. Availability is computed at request time for the
        requested period; the response echoes the position and its observation time.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lon, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: observedAt, in: query, required: true, schema: { type: string, format: date-time }, description: When the GPS fix was taken }
        - { name: accuracyM, in: query, schema: { type: number }, description: GPS accuracy radius in metres }
        - { name: radiusM, in: query, schema: { type: integer, default: 1000, maximum: 5000 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        '200':
          description: Facilities sorted by distance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyResult' }
              example:
                query:
                  position: { lat: 51.7700, lon: 19.4600, accuracyM: 15, observedAt: "2026-12-01T08:41:05Z" }
                  radiusM: 1000
                  period: { from: "2026-12-01T09:00:00Z", to: "2026-12-01T11:00:00Z" }
                  distanceModel: STRAIGHT_LINE_HAVERSINE
                generatedAt: "2026-12-01T08:41:06Z"
                results:
                  - facilityId: "10000000-0000-0000-0000-000000000003"
                    name: "Łódź Fabryczna"
                    address: "pl. Sałacińskiego 1"
                    lat: 51.769
                    lon: 19.4689
                    distanceM: 622
                    freeSpaces: 2
                    minPricePerHour: 3.50
        '422': { $ref: '#/components/responses/ValidationError' }

  /facilities/{facilityId}/spaces:
    get:
      summary: Spaces of one facility with availability for a period
      parameters:
        - { name: facilityId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                generatedAt: "2026-12-01T08:42:00Z"
                spaces:
                  - { spaceId: "5f2a...", label: "C-01", type: STANDARD, pricePerHour: 3.50, available: true }
                  - { spaceId: "9b1c...", label: "C-02", type: STANDARD, pricePerHour: 3.50, available: false }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations:
    post:
      summary: Hold (temporarily block) a space - creates a HELD reservation for 10 minutes
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldRequest' }
            example: { "spaceId": "5f2a...", "startTime": "2026-12-01T09:00:00Z", "endTime": "2026-12-01T11:00:00Z" }
      responses:
        '201':
          description: "Held. Replays carry header Idempotent-Replay = true."
          headers:
            Idempotent-Replay: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
              example:
                reservationId: "c0ffee00-..."
                operationId: "3b9d6f0e-2c4f-4f43-9d0a-1d3a2b7c9e11"
                status: HELD
                spaceId: "5f2a..."
                spaceLabel: "C-01"
                startTime: "2026-12-01T09:00:00Z"
                endTime: "2026-12-01T11:00:00Z"
                holdExpiresAt: "2026-12-01T08:52:10Z"
                totalAmount: 7.00
                currency: PLN
        '409':
          description: SPACE_UNAVAILABLE (competing request won) or OPERATION_IN_PROGRESS
          content:
            application/json:
              example: { "error": { "code": "SPACE_UNAVAILABLE", "message": "The space was just taken.", "details": { "alternatives": ["9d0e..."] } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: Reservation history of the current user (newest first)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [HELD, CONFIRMED, EXPIRED, CANCELLED, COMPLETED] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                generatedAt: "2026-12-01T10:00:00Z"
                items: [ { reservationId: "c0ffee00-...", status: CONFIRMED, spaceLabel: "C-01", facilityName: "Łódź Fabryczna", startTime: "2026-12-01T09:00:00Z", endTime: "2026-12-01T11:00:00Z", totalAmount: 7.00 } ]
                page: 1
                total: 1

  /reservations/{reservationId}:
    get:
      summary: One reservation (authoritative current state)
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /reservations/{reservationId}/payment:
    post:
      summary: SIMULATED payment for a HELD reservation -> CONFIRMED
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example: { "method": "SIMULATED_CARD", "simulateOutcome": "SUCCESS" }
      responses:
        '200':
          description: Payment succeeded (simulated) and reservation confirmed
          content:
            application/json:
              example:
                paymentId: "a1b2..."
                status: SUCCEEDED
                simulated: true
                amount: 7.00
                currency: PLN
                reservation: { reservationId: "c0ffee00-...", status: CONFIRMED }
        '402':
          description: PAYMENT_DECLINED (simulated decline, reservation stays HELD)
        '409':
          description: HOLD_EXPIRED, ALREADY_PAID or INVALID_STATE
          content:
            application/json:
              example: { "error": { "code": "HOLD_EXPIRED", "message": "The hold expired at 08:52:10Z." } }

  /reservations/{reservationId}/cancel:
    post:
      summary: Cancel a HELD or CONFIRMED reservation (before start)
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              example: { "reservationId": "c0ffee00-...", "status": "CANCELLED" }
        '409':
          description: ALREADY_CANCELLED or INVALID_STATE (e.g. already EXPIRED)

  /operations/{operationId}:
    get:
      summary: Recovery after a lost response - was this operation executed?
      description: |
        200 -> the operation was executed; `response` is exactly what the original call returned.
        404 -> the server never committed this operation; the client may safely resend the
        original request with the SAME operationId.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Operation found
          content:
            application/json:
              example:
                operationId: "3b9d6f0e-2c4f-4f43-9d0a-1d3a2b7c9e11"
                type: HOLD_SPACE
                outcome: SUCCEEDED
                httpStatus: 201
                resourceType: RESERVATION
                resourceId: "c0ffee00-..."
                createdAt: "2026-12-01T08:42:10Z"
                response: { reservationId: "c0ffee00-...", status: HELD, holdExpiresAt: "2026-12-01T08:52:10Z" }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/facilities:
    post:
      summary: Create facility (ADMIN)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            example: { "name": "Manufaktura P1", "address": "ul. Drewnowska 58", "latitude": 51.7798, "longitude": 19.4473 }
      responses:
        '201': { description: Created }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/facilities/{facilityId}/spaces:
    post:
      summary: Create space in facility (ADMIN)
      parameters:
        - { name: facilityId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example: { "label": "A-04", "spaceType": "STANDARD", "pricePerHour": 4.00 }
      responses:
        '201': { description: Created }
        '409': { description: LABEL_TAKEN }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/spaces/{spaceId}:
    patch:
      summary: Update price / activate / deactivate a space (ADMIN, optimistic locking)
      parameters:
        - { name: spaceId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            example: { "pricePerHour": 4.50, "isActive": true, "version": 3 }
      responses:
        '200': { description: Updated, new version returned }
        '409': { description: VERSION_CONFLICT - another admin changed the space }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: operationId - UUID v4 generated once per user intent, unchanged on retries
      schema: { type: string, format: uuid }
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 72 }
        displayName: { type: string, maxLength: 100 }
    HoldRequest:
      type: object
      required: [spaceId, startTime, endTime]
      properties:
        spaceId: { type: string, format: uuid }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time, description: "> startTime, max 24 h later" }
    Reservation:
      type: object
      properties:
        reservationId: { type: string, format: uuid }
        operationId: { type: string, format: uuid }
        status: { type: string, enum: [HELD, CONFIRMED, EXPIRED, CANCELLED, COMPLETED] }
        spaceId: { type: string, format: uuid }
        spaceLabel: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        holdExpiresAt: { type: string, format: date-time }
        totalAmount: { type: number }
        currency: { type: string, example: PLN }
    NearbyResult:
      type: object
      properties:
        query: { type: object }
        generatedAt: { type: string, format: date-time }
        results: { type: array, items: { type: object } }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
  responses:
    ValidationError:
      description: VALIDATION_ERROR or IDEMPOTENCY_KEY_REUSED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: INVALID_CREDENTIALS / TOKEN_EXPIRED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: ADMIN role required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource or operation not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Conflict with current state
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
